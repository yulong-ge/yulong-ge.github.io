name: Render a CV
on:
  push:
    branches:
      - main
      - master
    paths:
      - "_data/cv.yml"
      - "_data/cv_zh.yml"
      - "assets/rendercv/design.yaml"
      - "assets/rendercv/locale.yaml"
      - "assets/rendercv/locale-zh.yaml"
      - "assets/rendercv/settings.yaml"
      - "assets/rendercv/settings-zh.yaml"
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rendercv:
    name: RenderCV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.13"
      - name: RenderCV
        run: |
          for required_file in \
            _data/cv.yml \
            _data/cv_zh.yml \
            assets/rendercv/design.yaml \
            assets/rendercv/locale.yaml \
            assets/rendercv/locale-zh.yaml \
            assets/rendercv/settings.yaml \
            assets/rendercv/settings-zh.yaml; do
            if [ ! -f "$required_file" ]; then
              echo "Missing required RenderCV input: $required_file" >&2
              exit 1
            fi
          done

          uvx --from "rendercv[full]==2.8" rendercv render _data/cv.yml \
            --design assets/rendercv/design.yaml \
            --locale-catalog assets/rendercv/locale.yaml \
            --settings assets/rendercv/settings.yaml
          uvx --from "rendercv[full]==2.8" rendercv render _data/cv_zh.yml \
            --design assets/rendercv/design.yaml \
            --locale-catalog assets/rendercv/locale-zh.yaml \
            --settings assets/rendercv/settings-zh.yaml
          find assets/rendercv/rendercv_output -maxdepth 1 -type f \( -name '*.typ' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' \) -delete
      - name: Upload rendercv_output as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenderCV Output
          path: assets/rendercv/rendercv_output
      - name: Push the changes
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add \
            assets/rendercv/rendercv_output/Yulong_Ge_CV.pdf \
            assets/rendercv/rendercv_output/Yulong_Ge_CV_ZH.pdf
          if ! git diff --staged --quiet; then
            git commit -m "chore: render the latest CV"
            git push
          fi
