    科研与项目经历:
      - name: Feature-Space Planes Searcher (FPS) 领域自适应研究
        url: https://github.com/baogegeJiang/FPS
        summary: 在冻结预训练编码器的条件下，利用可复用的 H5 特征库调整决策边界，实现高效且可解释的特征空间领域自适应。
        highlights:
          - 提供公开的 PyTorch 实现。
          - 相关成果已发表于 IEEE TPAMI Early Access，2026。

      - name: 火星地质断层制图
        summary: 参与使用基础模型开展火星地质断层识别与制图的合作项目。
        highlights:
          - 协助断层数据的矢量化与标准化处理。
          - 参与断层制图流程中的部分工作。

      - name: 扩散生成模型的高效采样算法研究
        summary: 本科毕业设计，围绕扩散模型采样效率开展算法研究。
        highlights:
          - 探索并设计提升扩散模型采样效率的算法。

      - name: 基于生成模型的超声医学图像翻译
        summary: 使用生成模型开展跨模态医学图像翻译研究。
        highlights:
          - 探索生成更具诊断价值的影像信息，以缓解单一模态超声图像信息不足的问题。

